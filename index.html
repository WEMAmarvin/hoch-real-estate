<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HOCH Real Estate Advisory – Coming Soon</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="./assets/favicon-32x32.png">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
  <style>
    :root{--petrol:#00424A;--gold:#C8A46B;--white:#fff;}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{background:var(--petrol);color:var(--white);font-family:Inter,Arial,sans-serif;overflow:hidden}
    .hero{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 22px;position:relative;text-align:center;background:linear-gradient(rgba(0,66,74,.90),rgba(0,66,74,.94)),url('./assets/expose-bg-cover.png') center/cover no-repeat;}
    .hero::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at center, rgba(255,255,255,.08), transparent 42%);pointer-events:none;}
    .content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:34px;}
    .logo{display:block;width:min(420px,72vw);height:auto;filter:drop-shadow(0 18px 40px rgba(0,0,0,.25));}
    h1{font-family:Georgia,'Times New Roman',serif;font-size:clamp(44px,8vw,96px);font-weight:400;line-height:1;letter-spacing:.035em;margin:0;color:#fff;}
    .line{width:120px;height:1px;background:var(--gold);opacity:.9;margin-top:2px;}
    @media(max-width:640px){.content{gap:26px}.logo{width:min(330px,78vw)}h1{font-size:clamp(42px,13vw,68px)}}
  </style>
</head>
<body>
  <main class="hero" aria-label="HOCH Real Estate Advisory Coming Soon">
    <div class="content">
      <img class="logo" src="./assets/hoch-logo-comingsoon.png" alt="HOCH Real Estate Advisory" width="930" height="820">
      <div class="line" aria-hidden="true"></div>
      <h1>COMING SOON</h1>
    </div>
  </main>
</body>
</html>
