<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="description" content="HOCH Real Estate Advisory – Gewerbeimmobilien, Beratung und Vermittlung. Die neue Website erscheint in Kürze.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://hoch-real-estate.de/">
  <meta name="theme-color" content="#00424a">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="de_DE">
  <meta property="og:site_name" content="HOCH Real Estate Advisory">
  <meta property="og:title" content="Coming Soon | HOCH Real Estate Advisory">
  <meta property="og:description" content="Gewerbeimmobilien. Beratung. Vermittlung.">
  <meta property="og:url" content="https://hoch-real-estate.de/">
  <meta property="og:image" content="https://hoch-real-estate.de/assets/hoch-logo-horizontal.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Coming Soon | HOCH Real Estate Advisory">
  <meta name="twitter:description" content="Gewerbeimmobilien. Beratung. Vermittlung.">
  <meta name="twitter:image" content="https://hoch-real-estate.de/assets/hoch-logo-horizontal.png">
  <link rel="icon" type="image/svg+xml" href="assets/hoch-logo-vertical.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="preload" as="image" href="assets/expose-bg-cover.png" fetchpriority="high">
  <link rel="preload" as="image" href="assets/hoch-logo-vertical.png" fetchpriority="high">
  <style>
    :root{
      --petrol:#00424a;
      --petrol-dark:#002f34;
      --gold:#c8a46b;
      --cream:#f7f4ef;
      --white:#ffffff;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      min-height:100svh;
      overflow:hidden;
      font-family:Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color:var(--white);
      background:var(--petrol);
    }
    .coming-soon{
      position:relative;
      min-height:100svh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:clamp(2rem,5vw,4rem) 1.5rem;
      text-align:center;
      isolation:isolate;
    }
    .coming-soon::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(180deg, rgba(0,66,74,.78), rgba(0,47,52,.88)),
        url("assets/expose-bg-cover.png") center/cover no-repeat;
      z-index:-2;
    }
    .coming-soon::after{
      content:"";
      position:absolute;
      inset:0;
      background:radial-gradient(circle at center, rgba(255,255,255,.05), transparent 48%);
      z-index:-1;
    }
    .coming-soon__content{
      width:min(760px, 100%);
      display:flex;
      flex-direction:column;
      align-items:center;
      animation:fadeIn .8s ease-out both;
    }
    .coming-soon__logo{
      width:clamp(190px, 26vw, 330px);
      height:auto;
      display:block;
      margin-bottom:clamp(2rem, 4vw, 3rem);
      filter:drop-shadow(0 18px 38px rgba(0,0,0,.24));
    }
    .coming-soon__line{
      width:120px;
      height:1px;
      background:var(--gold);
      opacity:.95;
      margin-bottom:clamp(1.5rem, 3vw, 2.25rem);
    }
    h1{
      margin:0;
      font-family:Georgia, "Times New Roman", serif;
      font-size:clamp(3rem, 8vw, 7.25rem);
      line-height:.92;
      letter-spacing:.045em;
      font-weight:700;
      color:var(--cream);
      text-transform:uppercase;
      text-shadow:0 18px 38px rgba(0,0,0,.20);
    }
    .coming-soon__claim{
      margin:clamp(1.5rem, 3vw, 2.25rem) 0 0;
      color:var(--gold);
      font-size:clamp(.9rem, 1.7vw, 1.25rem);
      line-height:1.7;
      letter-spacing:.22em;
      text-transform:uppercase;
      font-weight:600;
    }
    .coming-soon__footer{
      position:fixed;
      left:0;
      right:0;
      bottom:max(1.25rem, env(safe-area-inset-bottom));
      display:flex;
      justify-content:center;
      align-items:center;
      gap:.9rem;
      font-size:.72rem;
      letter-spacing:.16em;
      text-transform:uppercase;
      z-index:2;
    }
    .coming-soon__footer a,
    .coming-soon__footer span{
      color:rgba(247,244,239,.76);
      text-decoration:none;
    }
    .coming-soon__footer a:hover{color:var(--gold)}
    @keyframes fadeIn{
      from{opacity:0;transform:translateY(14px)}
      to{opacity:1;transform:translateY(0)}
    }
    @media (max-width:640px){
      .coming-soon{padding:2rem 1.25rem 5rem}
      .coming-soon__logo{width:min(250px,72vw)}
      h1{font-size:clamp(2.55rem,14vw,4.35rem);letter-spacing:.035em}
      .coming-soon__claim{font-size:.75rem;letter-spacing:.18em;line-height:1.8}
      .coming-soon__footer{font-size:.66rem;gap:.65rem;bottom:max(1rem, env(safe-area-inset-bottom))}
    }
  </style>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "HOCH Real Estate Advisory",
    "url": "https://hoch-real-estate.de/",
    "logo": "https://hoch-real-estate.de/assets/hoch-logo-horizontal.png",
    "email": "christian@hoch-real-estate.de",
    "telephone": "+49 171 5744947",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "Emsstraße 18",
      "postalCode": "26135",
      "addressLocality": "Oldenburg",
      "addressCountry": "DE"
    }
  }
  </script>
</head>
<body>
  <main class="coming-soon" aria-label="Coming Soon">
    <section class="coming-soon__content">
      <img class="coming-soon__logo" src="assets/hoch-logo-vertical.png" alt="HOCH Real Estate Advisory" width="900" height="900">
      <div class="coming-soon__line" aria-hidden="true"></div>
      <h1>Coming Soon</h1>
      <p class="coming-soon__claim">Gewerbeimmobilien.<br>Beratung. Vermittlung.</p>
    </section>
  </main>
  <nav class="coming-soon__footer" aria-label="Rechtliche Hinweise">
    <a href="/impressum">Impressum</a>
    <span aria-hidden="true">|</span>
    <a href="/datenschutz">Datenschutz</a>
  </nav>
</body>
</html>
